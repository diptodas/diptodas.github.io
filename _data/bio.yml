short: >-
  Dipto Das is a Postdoctoral Associate in the Bowers College of Computing and Information Science at Cornell University, where he is part of the
  Cornell Global AI Initiative. His research examines responsible AI and its impact on marginalized communities in Global Majority contexts. He
  received his PhD in Information Science from the University of Colorado Boulder.
long: >-
  Dipto Das is a Postdoctoral Associate in the Bowers College of Computing and Information Science at Cornell University, where he works with
  Aditya Vashistha as part of the Cornell Global AI Initiative. His research examines responsible AI and its impact on society, especially for
  marginalized communities in Global Majority contexts and across cultures. He studies how AI systems, and the policies meant to govern them, fall
  short for the people they affect, focusing on AI governance in the public sector, the evaluation and alignment of AI systems, and online
  platforms and diaspora communities. His work appears in venues such as CHI, CSCW, FAccT, GROUP, DIS, AIES, TOCHI, and USENIX Security, has
  received four Best Paper Honorable Mention Awards, and has been featured in The Atlantic and on CBC. Before Cornell, he was a postdoctoral fellow
  in Computer Science at the University of Toronto. He received his PhD in Information Science from the University of Colorado Boulder. He has
  taught as an instructor of record at universities across the US, Canada, and Bangladesh, and received a Teaching Excellence Award.
